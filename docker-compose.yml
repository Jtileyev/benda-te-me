services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: benda_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: benda_te_me
      DB_USERNAME: benda
      DB_PASSWORD: benda_password
    depends_on:
      db:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    container_name: benda_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - app

  db:
    image: mariadb:11.4
    container_name: benda_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: benda_te_me
      MARIADB_USER: benda
      MARIADB_PASSWORD: benda_password
      MARIADB_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db_data:
